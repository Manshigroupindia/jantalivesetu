// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            def requested = details.requested
            if (requested.group == 'org.jetbrains.kotlin') {
                if (requested.name == 'kotlin-stdlib-jdk8' || requested.name == 'kotlin-stdlib-jdk7') {
                    details.useTarget("org.jetbrains.kotlin:${requested.name}:${rootProject.ext.kotlin_version}")
                }
                if (requested.name == 'kotlin-stdlib') {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}")
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
